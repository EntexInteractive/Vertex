syntax = "proto3";
option csharp_namespace = "Vertex.Server";
package files;

// Content-addressed, chunk-deduplicated file storage.
//
// Files are split with content-defined chunking (FastCDC), so an edit only changes the chunks around it.
// Each chunk is identified by the SHA-256 of its raw bytes and stored zstd-compressed. A file is a
// manifest (ordered list of chunk refs) whose id is a hash over that list, so both chunk ids and file ids
// can be recomputed and verified by the server and by clients.
//
// Push: FindMissingFiles -> FindMissingChunks -> UploadChunks (many, in parallel) -> SubmitFiles.
// Pull: GetManifest -> DownloadChunks (only for chunks not already available locally).
//
// Clients call this service over gRPC-Web so it works through proxies that drop HTTP/2 trailers, such as
// Cloudflare Tunnel. gRPC-Web can't stream from client to server, so uploads are unary batches.
service Files {
  rpc FindMissingFiles(FindMissingFilesRequest) returns (FindMissingFilesResponse);
  rpc FindMissingChunks(FindMissingChunksRequest) returns (FindMissingChunksResponse);
  rpc UploadChunks(UploadChunksRequest) returns (UploadChunksResponse);
  rpc SubmitFiles(SubmitFilesRequest) returns (SubmitFilesResponse);
  rpc GetManifest(GetManifestRequest) returns (FileManifest);
  rpc DownloadChunks(DownloadChunksRequest) returns (stream ChunkData);
}

message ChunkRef {
  bytes id = 1;    // SHA-256 of the raw chunk bytes.
  int64 size = 2;  // Raw (uncompressed) length in bytes.
}

message FileManifest {
  int64 size = 1;
  repeated ChunkRef chunks = 2;
}

message ChunkData {
  bytes id = 1;
  int64 size = 2;  // Raw length; the server and clients verify it after decompressing.
  bytes data = 3;  // zstd-compressed chunk bytes.
}

message FindMissingFilesRequest {
  repeated string file_ids = 1;
}

message FindMissingFilesResponse {
  repeated string file_ids = 1;
}

message FindMissingChunksRequest {
  repeated bytes ids = 1;
}

message FindMissingChunksResponse {
  repeated bytes ids = 1;
}

message UploadChunksRequest {
  repeated ChunkData chunks = 1;  // Total stays under the gRPC message limit (about one maximum-size chunk).
}

message UploadChunksResponse {
  int32 chunks_stored = 1;
  int64 bytes_received = 2;  // Compressed bytes received.
}

message SubmitFilesRequest {
  repeated FileManifest manifests = 1;
}

message SubmitFilesResponse {
  repeated string file_ids = 1;  // Server-computed id of each manifest, in request order.
}

message GetManifestRequest {
  string file_id = 1;
}

message DownloadChunksRequest {
  repeated bytes ids = 1;
}

// Project history. A workspace submits its changes as one revision and syncs the branch head.
//
// Submit: upload content with the Files service first (FindMissingFiles -> ... -> SubmitFiles), then call Submit
// with each changed path, its new file id and the file id it was based on. The server refuses the whole submit when
// any file changed on the branch since that base, so nobody overwrites someone else's work.
// Sync: GetHeadChanges pages through files changed after the workspace's last synced revision.
service Revisions {
  rpc Submit(SubmitRequest) returns (SubmitResponse);
  rpc GetHeadChanges(GetHeadChangesRequest) returns (GetHeadChangesResponse);
}

message FileChange {
  string path = 1;          // Relative to the workspace root, '/' separators.
  string file_id = 2;       // New content; empty to delete the file.
  string base_file_id = 3;  // Content the change was made from; empty for a new file.
}

message SubmitRequest {
  string project_id = 1;
  string branch_id = 2;
  string workspace_id = 3;
  string message = 4;
  repeated FileChange changes = 5;
}

message SubmitResponse {
  int64 revision = 1;
}

message GetHeadChangesRequest {
  string project_id = 1;
  string branch_id = 2;
  int64 after_revision = 3;  // 0 for every file on the branch.
  string page_token = 4;     // From the previous page; empty for the first.
}

message HeadFile {
  string path = 1;
  string file_id = 2;  // Empty when the file was deleted.
  int64 revision = 3;  // The revision that last changed it.
}

message GetHeadChangesResponse {
  int64 head_revision = 1;     // Latest revision on the branch when the page was read.
  repeated HeadFile files = 2;
  string next_page_token = 3;  // Empty on the last page.
}
