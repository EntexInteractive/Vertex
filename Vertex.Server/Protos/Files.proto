syntax = "proto3";
option csharp_namespace = "Vertex.Server";
package files;

// Content-addressed, chunk-deduplicated file storage.
//
// Files are split with content-defined chunking (FastCDC), so an edit only changes the chunks around it.
// Each chunk is identified by the SHA-256 of its raw bytes and stored zstd-compressed. A file is a
// manifest (ordered list of chunk refs) whose id is a hash over that list, so both chunk ids and file ids
// can be recomputed and verified by the server and by clients.
//
// Push: FindMissingFiles -> FindMissingChunks -> UploadChunks -> CommitFiles.
// Pull: GetManifest -> DownloadChunks (only for chunks not already available locally).
service Files {
  rpc FindMissingFiles(FindMissingFilesRequest) returns (FindMissingFilesResponse);
  rpc FindMissingChunks(FindMissingChunksRequest) returns (FindMissingChunksResponse);
  rpc UploadChunks(stream ChunkData) returns (UploadChunksResponse);
  rpc CommitFiles(CommitFilesRequest) returns (CommitFilesResponse);
  rpc GetManifest(GetManifestRequest) returns (FileManifest);
  rpc DownloadChunks(DownloadChunksRequest) returns (stream ChunkData);
}

message ChunkRef {
  bytes id = 1;    // SHA-256 of the raw chunk bytes.
  int64 size = 2;  // Raw (uncompressed) length in bytes.
}

message FileManifest {
  int64 size = 1;
  repeated ChunkRef chunks = 2;
}

message ChunkData {
  bytes id = 1;
  int64 size = 2;  // Raw length; the server and clients verify it after decompressing.
  bytes data = 3;  // zstd-compressed chunk bytes.
}

message FindMissingFilesRequest {
  repeated string file_ids = 1;
}

message FindMissingFilesResponse {
  repeated string file_ids = 1;
}

message FindMissingChunksRequest {
  repeated bytes ids = 1;
}

message FindMissingChunksResponse {
  repeated bytes ids = 1;
}

message UploadChunksResponse {
  int32 chunks_stored = 1;
  int64 bytes_received = 2;  // Compressed bytes received.
}

message CommitFilesRequest {
  repeated FileManifest manifests = 1;
}

message CommitFilesResponse {
  repeated string file_ids = 1;  // Server-computed id of each manifest, in request order.
}

message GetManifestRequest {
  string file_id = 1;
}

message DownloadChunksRequest {
  repeated bytes ids = 1;
}
