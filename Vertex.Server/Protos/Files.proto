syntax = "proto3";
option csharp_namespace = "Vertex.Server";
package files;

service Files {
  rpc UploadAsync(stream UploadFileRequest) returns (UploadFileResponse);
  rpc DownloadAsync(DownloadFileRequest) returns (stream DownloadFileResponse);
  // Returns the subset of the given file ids that the server does not already store.
  rpc FindMissing(FindMissingRequest) returns (FindMissingResponse);
}

message FindMissingRequest {
  repeated string file_ids = 1;
}

message FindMissingResponse {
  repeated string file_ids = 1;
}

message UploadFileRequest {
  oneof data {
    FileMetadata metadata = 1;
    bytes chunk = 2;
  }
}

message FileMetadata {
  string file_name = 1;
  string content_type = 2;
  int64 file_size = 3;
  string file_id = 4;
}

message UploadFileResponse {
  string file_id = 1;
  string file_name = 2;
  int64 bytes_received = 3;
}

message DownloadFileRequest {
  string file_id = 1;
}

message DownloadFileResponse {
  oneof data {
    FileMetadata metadata = 1;
    bytes chunk = 2;
  }
}
