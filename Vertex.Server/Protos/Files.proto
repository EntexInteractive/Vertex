syntax = "proto3";
option csharp_namespace = "Vertex.Server";
package files;

// Content-addressed, chunk-deduplicated file storage.
//
// Files are split with content-defined chunking (FastCDC), so an edit only changes the chunks around it.
// Each chunk is identified by the SHA-256 of its raw bytes and stored zstd-compressed. A file is a
// manifest (ordered list of chunk refs) whose id is a hash over that list, so both chunk ids and file ids
// can be recomputed and verified by the server and by clients.
//
// Push: FindMissingFiles -> FindMissingChunks -> UploadChunks (many, in parallel) -> SubmitFiles.
// Pull: GetManifest -> DownloadChunks (only for chunks not already available locally).
//
// Clients call this service over gRPC-Web so it works through proxies that drop HTTP/2 trailers, such as
// Cloudflare Tunnel. gRPC-Web can't stream from client to server, so uploads are unary batches.
service Files {
  rpc FindMissingFiles(FindMissingFilesRequest) returns (FindMissingFilesResponse);
  rpc FindMissingChunks(FindMissingChunksRequest) returns (FindMissingChunksResponse);
  rpc UploadChunks(UploadChunksRequest) returns (UploadChunksResponse);
  rpc SubmitFiles(SubmitFilesRequest) returns (SubmitFilesResponse);
  rpc GetManifest(GetManifestRequest) returns (FileManifest);
  rpc DownloadChunks(DownloadChunksRequest) returns (stream ChunkData);
}

message ChunkRef {
  bytes id = 1;    // SHA-256 of the raw chunk bytes.
  int64 size = 2;  // Raw (uncompressed) length in bytes.
}

message FileManifest {
  int64 size = 1;
  repeated ChunkRef chunks = 2;
}

message ChunkData {
  bytes id = 1;
  int64 size = 2;  // Raw length; the server and clients verify it after decompressing.
  bytes data = 3;  // zstd-compressed chunk bytes.
}

message FindMissingFilesRequest {
  repeated string file_ids = 1;
}

message FindMissingFilesResponse {
  repeated string file_ids = 1;
}

message FindMissingChunksRequest {
  repeated bytes ids = 1;
}

message FindMissingChunksResponse {
  repeated bytes ids = 1;
}

message UploadChunksRequest {
  repeated ChunkData chunks = 1;  // Total stays under the gRPC message limit (about one maximum-size chunk).
}

message UploadChunksResponse {
  int32 chunks_stored = 1;
  int64 bytes_received = 2;  // Compressed bytes received.
}

message SubmitFilesRequest {
  repeated FileManifest manifests = 1;
}

message SubmitFilesResponse {
  repeated string file_ids = 1;  // Server-computed id of each manifest, in request order.
}

message GetManifestRequest {
  string file_id = 1;
}

message DownloadChunksRequest {
  repeated bytes ids = 1;
}

// Project history. A workspace submits its changes as one revision and syncs the branch head.
//
// Submit: upload content with the Files service first (FindMissingFiles -> ... -> SubmitFiles), then call Submit
// with each changed path, its new file id and the file id it was based on. The server refuses the whole submit when
// any file changed on the branch since that base, so nobody overwrites someone else's work.
// Sync: GetHeadChanges pages through files changed after the workspace's last synced revision, up to the latest
// revision or an older one. When `full` is set the pages list every file at that revision instead, and the workspace
// removes tracked files that aren't in them.
// History: GetRevisions lists a branch's revisions after a number, oldest first, and GetRevisionChanges pages through
// the files one revision changed (for logs, and for mirroring a branch into another version control system).
service Revisions {
  rpc Submit(SubmitRequest) returns (SubmitResponse);
  rpc GetHeadChanges(GetHeadChangesRequest) returns (GetHeadChangesResponse);
  rpc GetRevisions(GetRevisionsRequest) returns (GetRevisionsResponse);
  rpc GetRevisionChanges(GetRevisionChangesRequest) returns (GetRevisionChangesResponse);
}

message FileChange {
  string path = 1;          // Relative to the workspace root, '/' separators.
  string file_id = 2;       // New content; empty to delete the file.
  string base_file_id = 3;  // Content the change was made from; empty for a new file.
}

message SubmitRequest {
  string project_id = 1;
  string branch_id = 2;
  string workspace_id = 3;
  string message = 4;
  repeated FileChange changes = 5;
  string host = 6;  // The workspace's machine name, for lock messages.
}

message SubmitResponse {
  int64 revision = 1;
}

message GetHeadChangesRequest {
  string project_id = 1;
  string branch_id = 2;
  int64 after_revision = 3;  // 0 for every file on the branch.
  string page_token = 4;     // From the previous page; empty for the first.
  int64 revision = 5;        // The revision to sync to; 0 for the latest. Newer than the latest fails (FAILED_PRECONDITION).
}

message HeadFile {
  string path = 1;
  string file_id = 2;  // Empty when the file was deleted.
  int64 revision = 3;  // The revision that last changed it.
}

message GetHeadChangesResponse {
  int64 head_revision = 1;     // The revision synced to: the latest on the branch when the first page was read, or the one asked for.
  repeated HeadFile files = 2;
  string next_page_token = 3;  // Empty on the last page.
  bool full = 4;               // The pages list every file at head_revision (no deletions): remove tracked files not in them.
  int64 latest_revision = 5;   // The branch's latest revision, to tell the user how far behind an older sync is.
}

message GetRevisionsRequest {
  string project_id = 1;
  string branch_id = 2;
  int64 after_revision = 3;  // 0 for the branch's first revisions.
  int32 limit = 4;           // Most revisions to return; 0 for the default (100), at most 1,000.
}

message RevisionInfo {
  int64 number = 1;
  string message = 2;
  string username = 3;
  string display_name = 4;  // Empty when the user has none.
  int64 created_at = 5;     // Unix milliseconds.
  int32 files = 6;          // Files the revision changed.
}

message GetRevisionsResponse {
  repeated RevisionInfo revisions = 1;  // Oldest first. Fewer than the limit means there are no more yet.
}

message GetRevisionChangesRequest {
  string project_id = 1;
  string branch_id = 2;
  int64 revision = 3;
  string page_token = 4;  // From the previous page; empty for the first.
}

message RevisionFileChange {
  string path = 1;
  string file_id = 2;  // The file's content after the revision; empty when the revision deleted it.
}

message GetRevisionChangesResponse {
  repeated RevisionFileChange changes = 1;
  string next_page_token = 2;  // Empty on the last page.
}

// File locks. Clients lock a path on a branch as soon as they see it change and keep the lock until the change is
// submitted, reverted or undone, so two people never edit the same file. Locks belong to a user in one workspace.
//
// Every lock and release is a numbered event in the project. Clients call GetLockEvents with the last seq they saw to
// learn what others locked (and make those files read-only); when nothing changed that call costs almost nothing.
service Locks {
  rpc Lock(LockRequest) returns (LockResponse);
  rpc Unlock(UnlockRequest) returns (UnlockResponse);
  rpc GetLockEvents(GetLockEventsRequest) returns (GetLockEventsResponse);
}

message LockRequest {
  string project_id = 1;
  string branch_id = 2;
  string workspace_id = 3;
  string host = 4;
  repeated string paths = 5;
}

enum LockStatus {
  LOCK_STATUS_GRANTED = 0;        // Locked now.
  LOCK_STATUS_ALREADY_YOURS = 1;  // This workspace already held it.
  LOCK_STATUS_HELD = 2;           // Someone else (or you, in another workspace) holds it.
}

message LockResult {
  string path = 1;
  LockStatus status = 2;
  string username = 3;  // The holder, for LOCK_STATUS_HELD.
  string host = 4;
  bool same_user = 5;   // Held by the caller in another workspace.
}

message LockResponse {
  repeated LockResult results = 1;  // In request order.
}

message UnlockRequest {
  string project_id = 1;
  string branch_id = 2;
  string workspace_id = 3;
  repeated string paths = 4;
  bool force = 5;  // Also release locks held elsewhere: your own from any workspace, or anyone's for project admins.
}

message UnlockResponse {
  repeated string released = 1;
}

message GetLockEventsRequest {
  string project_id = 1;
  string branch_id = 2;
  int64 after_seq = 3;  // 0 for the full list.
}

message LockInfo {
  string path = 1;
  string username = 2;
  string workspace_id = 3;
  string host = 4;
  int64 created_at = 5;  // Unix milliseconds.
}

message LockEvent {
  int64 seq = 1;
  bool released = 2;    // False when the path was locked.
  LockInfo lock = 3;
}

message GetLockEventsResponse {
  int64 latest_seq = 1;
  // True when after_seq is too old (or 0): locks holds the branch's full lock list and events is empty.
  bool reset = 2;
  repeated LockEvent events = 3;  // The branch's events after after_seq, in order.
  repeated LockInfo locks = 4;
}
