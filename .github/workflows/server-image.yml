name: Server Image

# Reusable workflow: builds the Vertex Server image for linux/amd64 and linux/arm64 and pushes it to the GitHub
# Container Registry and Docker Hub. Called by "Build Latest" (pushes to main) and "Release" (release/** branches).
# Callers need `permissions: packages: write` and `secrets: inherit`.

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build.
        type: string
        required: true
      tags:
        description: Image tags, in docker/metadata-action `tags` syntax (one per line).
        type: string
        required: true
      version:
        description: Version built into the server and its image label (e.g. 1.3.0-beta.1). Empty keeps the .csproj default.
        type: string
        required: false
        default: ''
      assembly_version:
        description: Numeric assembly and file version (e.g. 1.3.0.0). Empty keeps the .csproj default.
        type: string
        required: false
        default: ''

permissions:
  contents: read
  packages: write   # push to ghcr.io with the built-in GITHUB_TOKEN

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest
    env:
      # Both registries are required. Set these under Settings -> Secrets and variables -> Actions.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Check Docker Hub secrets
        if: env.DOCKERHUB_USERNAME == '' || env.DOCKERHUB_TOKEN == ''
        run: |
          echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN must be set as repository secrets (Settings -> Secrets and variables -> Actions) to publish to Docker Hub."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      # Image names must be lowercase; metadata-action lowercases them and adds OCI labels (source, license,
      # revision), which also links the GHCR package to this repository.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/vertex-server
            docker.io/${{ env.DOCKERHUB_USERNAME }}/vertex-server
          tags: ${{ inputs.tags }}
          labels: |
            org.opencontainers.image.title=Vertex Server
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.revision=${{ inputs.ref }}
            ${{ inputs.version != '' && format('org.opencontainers.image.version={0}', inputs.version) || '' }}

      - name: Build and push Vertex Server
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Vertex.Server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ inputs.version }}
            ASSEMBLY_VERSION=${{ inputs.assembly_version }}
          # Layer cache shared between Build Latest and Release runs.
          cache-from: type=gha,scope=vertex-server
          cache-to: type=gha,scope=vertex-server,mode=max
