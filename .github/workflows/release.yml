name: Release

# Push a branch named release/<version> (e.g. release/1.2.0 or release/1.3.0-beta.1) to publish a release:
#   1. The version is taken from the branch name and written into every .csproj, then committed to the branch.
#   2. Every app in APPS is published as a self-contained, single-file executable for every platform below.
#   3. The server image is pushed to GHCR and Docker Hub, tagged <version>, plus <major>.<minor> and stable for
#      non-pre-release versions.
#   4. A GitHub release v<version> is created from that commit, with one archive per app and platform
#      (vx-win-x64.zip, VertexServer-linux-arm64.tar.gz, ...) and SHA256SUMS.txt. It is published only after every
#      build and the image succeed.
# Versions with a suffix (-beta.1) are marked as pre-releases. Re-running the workflow replaces the release's files;
# pushing new commits after a release fails instead, so each version always matches exactly one commit. Release a new
# version for new changes.

on:
  push:
    branches: [ 'release/**' ]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # ---- Names: rename things here ----------------------------------------------------------------------------------
  # Apps to publish, one per line: <project> <name>. Each archive is named <name>-<platform> (e.g. vx-win-x64.zip)
  # and <name> must match the project's AssemblyName, which is the executable inside. Lines starting with # are skipped.
  APPS: |
    Vertex.Cli/Vertex.Cli.csproj        vx
    Vertex.Server/Vertex.Server.csproj  VertexServer
    # Vertex.Gui/Vertex.Gui.csproj      Vertex
  RELEASE_TITLE_PREFIX: Vertex                # release title is "<prefix> <version>"
  # ------------------------------------------------------------------------------------------------------------------
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  version:
    name: Set version
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit the version bump to the release branch
    outputs:
      version: ${{ steps.parse.outputs.version }}
      series: ${{ steps.parse.outputs.series }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
      sha: ${{ steps.commit.outputs.sha }}
      short_sha: ${{ steps.commit.outputs.short_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from branch name
        id: parse
        run: |
          raw="${GITHUB_REF_NAME#release/}"
          version="${raw#v}"
          if ! [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Branch '$GITHUB_REF_NAME' must be named release/<major>.<minor>.<patch>[-suffix], e.g. release/1.2.0 or release/1.3.0-beta.1."
            exit 1
          fi
          numeric="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}.0"
          prerelease=false; [[ -n "${BASH_REMATCH[4]}" ]] && prerelease=true
          echo "version=$version"       >> "$GITHUB_OUTPUT"
          echo "numeric=$numeric"       >> "$GITHUB_OUTPUT"
          echo "series=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Releasing $version (assembly version $numeric, pre-release: $prerelease)"

      - name: Write version into .csproj files
        env:
          VERSION: ${{ steps.parse.outputs.version }}
          NUMERIC: ${{ steps.parse.outputs.numeric }}
        run: |
          # AssemblyVersion/FileVersion must be numeric (1.2.0.0); Version carries the full version (1.3.0-beta.1).
          find . -name '*.csproj' -not -path '*/node_modules/*' -print0 | while IFS= read -r -d '' project; do
            sed -i -E \
              -e "s#<AssemblyVersion>[^<]*</AssemblyVersion>#<AssemblyVersion>${NUMERIC}</AssemblyVersion>#" \
              -e "s#<Version>[^<]*</Version>#<Version>${VERSION}</Version>#" \
              "$project"
          done
          git diff --stat

      - name: Commit version bump
        id: commit
        env:
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          if git diff --quiet; then
            echo "Project files already at $VERSION."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Set version to $VERSION"
            # Pushes made with GITHUB_TOKEN don't trigger workflows, so this doesn't start another release run.
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: version
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # rid: .NET runtime identifier. platform: the name used in the archive (rename freely, e.g. osx -> macos).
        # Each platform builds on its own OS: Windows embeds the icon, macOS signs the executable.
        include:
          - { os: windows-latest, rid: win-x64,     platform: win-x64,     archive: zip }
          - { os: windows-latest, rid: win-arm64,   platform: win-arm64,   archive: zip }
          - { os: ubuntu-latest,  rid: linux-x64,   platform: linux-x64,   archive: tar.gz }
          - { os: ubuntu-latest,  rid: linux-arm64, platform: linux-arm64, archive: tar.gz }
          - { os: macos-latest,   rid: osx-x64,     platform: osx-x64,     archive: tar.gz }
          - { os: macos-latest,   rid: osx-arm64,   platform: osx-arm64,   archive: tar.gz }

    steps:
      - name: Checkout version commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish and package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          while read -r project app; do
            [[ -z "$project" || "$project" == \#* ]] && continue
            archive="${app}-${{ matrix.platform }}"
            out="publish/$app"
            echo "::group::$archive"
            dotnet publish "$project" \
              --configuration Release \
              --runtime ${{ matrix.rid }} \
              --self-contained true \
              --output "$out" \
              -p:PublishSingleFile=true \
              -p:IncludeNativeLibrariesForSelfExtract=true \
              -p:DebugType=None \
              -p:DebugSymbols=false
            if [[ ! -f "$out/$app" && ! -f "$out/$app.exe" ]]; then
              echo "::error::$project didn't produce an executable named '$app'. Set the name in APPS to the project's AssemblyName."
              exit 1
            fi
            rm -f "$out/web.config"   # IIS-only file the web SDK adds
            cp LICENSE README.md "$out/"
            if [[ "${{ matrix.archive }}" == "zip" ]]; then
              (cd "$out" && 7z a -tzip "$GITHUB_WORKSPACE/dist/$archive.zip" . > /dev/null)
            else
              chmod +x "$out/$app"
              tar -czf "dist/$archive.tar.gz" -C "$out" .
            fi
            echo "::endgroup::"
          done < <(printf '%s\n' "$APPS" | tr -d '\r')
          ls -lh dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  image:
    name: Server image
    needs: version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/server-image.yml
    with:
      ref: ${{ needs.version.outputs.sha }}
      version: ${{ needs.version.outputs.version }}
      # Pre-releases get only their exact version; full releases also move <major>.<minor> and stable.
      tags: |
        type=raw,value=${{ needs.version.outputs.version }}
        type=raw,value=${{ needs.version.outputs.series }},enable=${{ needs.version.outputs.prerelease != 'true' }}
        type=raw,value=stable,enable=${{ needs.version.outputs.prerelease != 'true' }}
        type=raw,value=sha-${{ needs.version.outputs.short_sha }}
    secrets: inherit

  release:
    name: Publish GitHub release
    needs: [ version, build, image ]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the tag and release

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            tagged=$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)
            if [[ "$tagged" != "$SHA" ]]; then
              echo "::error::Release $tag already exists for commit ${tagged:0:7}, but this build is ${SHA:0:7}. Push a new release/<version> branch, or delete the $tag release and tag to rebuild it."
              exit 1
            fi
            echo "Release $tag exists for this commit; replacing its files."
            gh release upload "$tag" dist/* --clobber
          else
            flags=(--target "$SHA" --title "$RELEASE_TITLE_PREFIX $VERSION" --generate-notes)
            [[ "$PRERELEASE" == "true" ]] && flags+=(--prerelease)
            gh release create "$tag" dist/* "${flags[@]}"
          fi
