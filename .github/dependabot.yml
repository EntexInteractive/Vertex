version: 2
updates:

  - package-ecosystem: "nuget"
    directory: "/Vertex.Agent"
    schedule:
      interval: "daily"

  - package-ecosystem: "nuget"
    directory: "/Vertex.Cli"
    schedule:
      interval: "daily"

  - package-ecosystem: "nuget"
    directory: "/Vertex.Core"
    schedule:
      interval: "daily"

  - package-ecosystem: "nuget"
    directory: "/Vertex.Server"
    schedule:
      interval: "daily"

  - package-ecosystem: "npm"
    directory: "/Vertex.Web"
    schedule:
      interval: "daily"

  - package-ecosystem: "nuget"
    directory: "/Vertex.Core.Client"
    schedule:
      interval: "daily"

  - package-ecosystem: "nuget"
    directory: "/Vertex.Gui"
    schedule:
      interval: "daily"

  - package-ecosystem: "github-actions"
