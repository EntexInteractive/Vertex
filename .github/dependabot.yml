# Dependency updates, batched to keep the noise down: once a week, minor and patch updates for each ecosystem arrive
# as one grouped pull request, and .github/workflows/dependabot-auto-merge.yml merges it once CI passes. Major updates
# still arrive one per pull request and wait for a human, because they can break things.

version: 2

updates:
  - package-ecosystem: "nuget"
    directories:
      - "/Vertex.Agent"
      - "/Vertex.Cli"
      - "/Vertex.Core"
      - "/Vertex.Core.Client"
      - "/Vertex.Gui"
      - "/Vertex.Server"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      # gRPC and Protobuf packages must move together, including major versions.
      grpc:
        patterns: [ "Grpc.*", "Google.Protobuf" ]
      nuget-minor-and-patch:
        update-types: [ "minor", "patch" ]
    ignore:
      # These packages are versioned with .NET itself. Stay on the major version matching the projects'
      # TargetFramework (net10.0) and remove these rules when upgrading to the next .NET version.
      - dependency-name: "Microsoft.Extensions.*"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: [ "version-update:semver-major" ]

  - package-ecosystem: "npm"
    directory: "/Vertex.Web"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      npm-minor-and-patch:
        update-types: [ "minor", "patch" ]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns: [ "*" ]

  - package-ecosystem: "docker"
    directory: "/Vertex.Server"
    schedule:
      interval: "weekly"
      day: "monday"
    ignore:
      # The server targets net10.0 and won't start on a newer major runtime. Remove when upgrading .NET.
      - dependency-name: "dotnet/*"
        update-types: [ "version-update:semver-major" ]

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
