name: Feature request
description: Suggest an idea or improvement for Vertex.
labels: [ "enhancement" ]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation and what makes it hard today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
      description: How you'd want it to work. Example commands are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: Anything you've tried, or how other tools (git, Perforce, ...) handle it.
